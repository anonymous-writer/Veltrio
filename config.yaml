# Veltrio configuration
# Command-line options override these values.

server:
  host: "0.0.0.0"
  port: 3010

paths:
  data: "/home/oai/.local/share/veltrio"
  downloads: "/home/oai/Downloads/Veltrio"

downloads:
  max_concurrent: 3
  resume_on_start: true
  delete_file_on_remove: true

logging:
  level: "info"

# NTFY Push notifications
ntfy_enabled: true
ntfy_debug: true
database_debug: true
ntfy_url: "http://127.0.0.1:2586/PI-Micha-Info"
ntfy_token: ""
ntfy_notify_unknown_ipv4: true
ntfy_priority: "high"
ntfy_timeout_seconds: 10
