# Veltrio configuration
# Command-line options override these values.

server:
  host: "0.0.0.0"
  port: 3010

paths:
  data: "/home/oai/.local/share/veltrio"
  downloads: "/home/oai/Downloads/Veltrio"

downloads:
  max_concurrent: 3
  resume_on_start: true
  delete_file_on_remove: true

logging:
  level: "info"
