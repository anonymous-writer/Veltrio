name: Build Linux binaries
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o dist/veltrio-linux-${{ matrix.arch }} ./cmd/veltrio
      - uses: actions/upload-artifact@v4
        with:
          name: veltrio-linux-${{ matrix.arch }}
          path: dist/veltrio-linux-${{ matrix.arch }}
