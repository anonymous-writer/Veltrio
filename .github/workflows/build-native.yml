name: Build native Linux binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Test Go source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...

  build:
    needs: test
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then VERSION=dev; fi
          go build -trimpath -tags nosqlite,web \
            -ldflags="-s -w -X github.com/GopeedLab/gopeed/pkg/base.Version=${VERSION} -X github.com/GopeedLab/gopeed/pkg/base.InDocker=false" \
            -o "veltrio-linux-${GOARCH}" ./cmd/web
          chmod +x "veltrio-linux-${GOARCH}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrio-linux-${{ matrix.arch }}
          path: veltrio-linux-${{ matrix.arch }}

      - name: Attach binary to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "veltrio-linux-${GOARCH}" --clobber
